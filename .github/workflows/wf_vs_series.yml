name: Parallel Sub-Workflow 5 - VS Series

on:
  workflow_call:
  workflow_dispatch:

jobs:
  run_vs_series:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install -r requirements.txt
          echo "VS Series sub-workflow complete."
