name: OmniVoice TTS & 7 Parallel Workflows Pipeline

on:
  repository_dispatch:
    types: [script_gk2_passed]
  workflow_dispatch:
    inputs:
      batch_id:
        description: 'Batch ID'
        required: false
        default: '1'

jobs:
  omni_orchestrate_and_gk3:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache OmniVoice k2-fsa Model Checkpoints (~GBs)
        id: omni-model-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/omni_k2fsa
          key: omni-k2fsa-models-${{ runner.os }}-${{ hashFiles('models.json') }}
          restore-keys: |
            omni-k2fsa-models-${{ runner.os }}-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure Model Checkpoints Cached
        run: |
          python src/cache_manager.py

      - name: Run Unit Tests
        run: |
          pytest tests/

      - name: Download Script Artifact (if dispatched)
        if: github.event_name == 'repository_dispatch'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.PIPELINE_PAT }}
          workflow: scripting_pipeline.yml
          name: script-gk2-artifact
          path: artifacts/
          repo: naadld/lelestory.scripting
          run_id: ${{ github.event.client_payload.run_id }}

      - name: Create Fallback Script Artifact (if manual trigger)
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p artifacts
          cat << 'EOF' > artifacts/script_gk2.json
          {
            "batch_id": ${{ github.event.inputs.batch_id || 1 }},
            "theme": "HANZIDEGUSHI",
            "script": {
              "batch_id": 1,
              "lines": [
                {"speaker": "Narrator", "zh": "Bạn có biết chữ 休 không?", "pinyin": "Bàn yǒu zhī chǔ Xiū kōng?", "vi": "Bạn có biết chữ 休 không?"},
                {"speaker": "LeLe", "zh": "Chữ 休: Con người dựa vào cây.", "pinyin": "Chǔ Xiū: Cōn nónguó dūa váo cāy.", "vi": "Chữ 休: Con người dựa vào cây."}
              ]
            },
            "prompts": {
              "instagram_carousel": ["[IG-POST001-SLIDE1-1x1-ST2] | Modern illustration"]
            },
            "metadata": {
              "title": "Chữ 休",
              "description": "Chiết tự chữ 休"
            },
            "status": "GK2_Passed"
          }
          EOF

      - name: Synthesize OmniVoice TTS & Run GK3
        run: |
          python src/gatekeeper3.py --script-input artifacts/script_gk2.json --output artifacts/omni_gk3.json

      - name: Upload Omni Audio Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omni-gk3-artifact
          path: |
            artifacts/omni_gk3.json
            audio_output/

      - name: Dispatch to Render Repository
        if: success()
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PIPELINE_PAT }}
          repository: naadld/lelestory.render
          event-type: omni_gk3_passed
          client-payload: '{"artifact_name": "omni-gk3-artifact", "run_id": "${{ github.run_id }}"}'
