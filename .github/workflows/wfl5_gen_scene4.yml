name: WFL 5 - Gen Scene 4 Audio

'on':
  workflow_dispatch:
    inputs:
      row_id:
        description: 'Target Sheet Row Number (# ID)'
        required: true
        default: '2'

jobs:
  synthesize_voice_section:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache OmniVoice (k2-fsa) Models & Voice Samples
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/omnivoice
            ~/.cache/k2-fsa
          key: omnivoice-k2fsa-model-v1
          restore-keys: |
            omnivoice-k2fsa-model-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests gspread google-auth

      - name: Seed / Verify Pinned Reference Voice Sample in Cache
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SA_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "🔊 Ensuring OmniVoice reference voice sample is pinned in ~/.cache/omnivoice/voice_samples/reference.wav..."
          python -c "import sys; sys.path.insert(0, 'src'); from cache_manager import ModelCacheManager; mgr = ModelCacheManager(); mgr.ensure_models_cached(); p = mgr.ensure_voice_sample_cached(); print(f'Pinned sample verified at: {p}')"

      - name: Synthesize OmniVoice Section [scene4]
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SA_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "🎙️ Synthesizing OmniVoice section 'scene4' for Row #${{ github.event.inputs.row_id }}..."
          python src/omni_tts.py --row-id "${{ github.event.inputs.row_id }}" --section "scene4"

      - name: Install rclone
        run: |
          if ! command -v rclone &> /dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          fi
          rclone version

      - name: Upload Audio to Google Drive (Voice Folder)
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          ROW_ID="${{ github.event.inputs.row_id || '2' }}"
          VOICE_FOLDER_ID="1AgtKSIhgRDW4NfMJi5I1X1l2sXYgFh1e"
          LOCAL_DIR="artifacts/voice_row_${ROW_ID}"
          echo "Uploading from ${LOCAL_DIR} to ${VOICE_FOLDER_ID}..."
          rclone copy "${LOCAL_DIR}" gdrive: --drive-root-folder-id "${VOICE_FOLDER_ID}" --include "*.wav" --retries 3 --retries-sleep 3s -v

      - name: Upload Section Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice_row_${{ github.event.inputs.row_id || '2' }}_scene4
          path: artifacts/voice_row_${{ github.event.inputs.row_id || '2' }}
          retention-days: 7
