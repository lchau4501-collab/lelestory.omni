name: WFL 4 - Gen Scene 3 Audio

on:
  workflow_dispatch:
    inputs:
      row_id:
        description: 'Target Sheet Row Number (# ID)'
        required: true
        default: '2'

jobs:
  synthesize_voice_section:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache OmniVoice (k2-fsa) Models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/omnivoice
            ~/.cache/k2-fsa
          key: omnivoice-k2fsa-model-v1
          restore-keys: |
            omnivoice-k2fsa-model-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Enforce Voice Mark Audio Reference (Strict 0% Fallback)
        run: |
          echo "🔒 Locking Voice Mark sample into OmniVoice cache..."
          mkdir -p ~/.cache/omnivoice/voice_samples
          cp "assets/voice_preview_mark.mp3" ~/.cache/omnivoice/voice_samples/voice_preview_mark.mp3
          cp "assets/reference.txt" ~/.cache/omnivoice/voice_samples/reference.txt
          test -s ~/.cache/omnivoice/voice_samples/voice_preview_mark.mp3 || (echo "❌ Missing Voice Mark sample!" && exit 1)
          echo "✅ Voice Mark sample locked: $(ls -lh ~/.cache/omnivoice/voice_samples/voice_preview_mark.mp3)"

      - name: Synthesize OmniVoice Section [scene3]
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          USER_OAUTH_JSON: ${{ secrets.USER_OAUTH_JSON }}
        run: |
          echo "🎙️ Synthesizing OmniVoice section 'scene3' for Row #${{ github.event.inputs.row_id }}..."
          python src/omni_tts.py --row-id "${{ github.event.inputs.row_id }}" --section "scene3"