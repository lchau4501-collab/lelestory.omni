name: Gatekeeper 3 (GK3) Independent Audit & Self-Healing

on:
  workflow_dispatch:
    inputs:
      row_id:
        description: 'Target Sheet Row Number (# ID)'
        required: true
        default: '2'

jobs:
  audit_and_heal_voiceover:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Audit 7 Voice Files in GFolder 'voice'
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          GITHUB_TOKEN: ${{ secrets.PIPELINE_PAT }}
        run: |
          echo "🛡️ Gatekeeper 3 Auditing 7 Audio Files for Row #${{ github.event.inputs.row_id }}..."
          python src/gatekeeper3.py --row-id "${{ github.event.inputs.row_id }}"