name: Parallel Sub-Workflow 7 - Social Carousels

on:
  workflow_call:
  workflow_dispatch:

jobs:
  run_social_carousels:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install -r requirements.txt
          echo "Social Carousels sub-workflow complete."
