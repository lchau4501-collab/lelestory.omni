name: Parallel Sub-Workflow 6 - Dialogues

on:
  workflow_call:
  workflow_dispatch:

jobs:
  run_dialogues:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install -r requirements.txt
          echo "Dialogues sub-workflow complete."
