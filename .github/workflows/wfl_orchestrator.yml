name: OmniVoice TTS - Orchestrator (7 Parallel Sub-Workflows)

'on':
  workflow_dispatch:
    inputs:
      row_id:
        description: 'Target Sheet Row Number (# ID)'
        required: true
        default: '2'
  repository_dispatch:
    types: [script_gk2_passed]

jobs:
  prepare_model_cache:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache OmniVoice (k2-fsa) Models & Voice Samples
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/omnivoice
            ~/.cache/k2-fsa
          key: omnivoice-k2fsa-models-v6
          restore-keys: |
            omnivoice-k2fsa-models-v6
            omnivoice-k2fsa-model-

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          pip install requests gspread google-auth sherpa-onnx soundfile numpy

      - name: Fast Seed / Verify Neural Models & Voice Sample
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SA_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          bash scripts/seed_models_runner.sh

      - name: Verify Neural Models & Smoke Test Inference
        run: |
          python scripts/verify_neural_models.py

  launch_parallel_7_workflows:
    needs: prepare_model_cache
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests gspread google-auth

      - name: Launch 7 Parallel Story Sub-Workflows
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SA_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GITHUB_TOKEN: ${{ secrets.PIPELINE_PAT }}
        run: |
          TARGET_ROW="${{ github.event.inputs.row_id || github.event.client_payload.batch_id || '2' }}"
          echo "🚀 Triggering 7 Parallel OmniVoice Sub-Workflows for Row #${TARGET_ROW}..."
          python src/parallel_orchestrator.py --row-id "${TARGET_ROW}"
