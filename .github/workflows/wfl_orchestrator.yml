name: OmniVoice TTS - Orchestrator (7 Parallel Sub-Workflows)

on:
  workflow_dispatch:
    inputs:
      row_id:
        description: 'Target Sheet Row Number (# ID)'
        required: true
        default: '2'
  repository_dispatch:
    types: [script_gk2_passed]

jobs:
  launch_parallel_7_workflows:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache OmniVoice (k2-fsa) Models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/omnivoice
            ~/.cache/k2-fsa
          key: omnivoice-k2fsa-model-v1
          restore-keys: |
            omnivoice-k2fsa-model-

      - name: Launch 7 Parallel Story Sub-Workflows
        env:
          GITHUB_TOKEN: ${{ secrets.PIPELINE_PAT }}
        run: |
          TARGET_ROW="${{ github.event.inputs.row_id || github.event.client_payload.batch_id || '2' }}"
          echo "🚀 Triggering 7 Parallel OmniVoice Sub-Workflows for Row #${TARGET_ROW}..."
          python src/parallel_orchestrator.py --row-id "${TARGET_ROW}"
