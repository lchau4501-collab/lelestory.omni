name: WFL 6 - Gen Vocab Recap Audio

on:
  workflow_dispatch:
    inputs:
      row_id:
        description: 'Target Sheet Row Number (# ID)'
        required: true
        default: '2'

jobs:
  synthesize_voice_section:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache OmniVoice (k2-fsa) Models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/omnivoice
            ~/.cache/k2-fsa
          key: omnivoice-k2fsa-model-v1
          restore-keys: |
            omnivoice-k2fsa-model-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests gspread google-auth soundfile numpy pypinyin transformers accelerate torch torchaudio omnivoice

      - name: Synthesize OmniVoice Section [vocab]
        env:
          GOOGLE_SA_JSON: ${ secrets.GOOGLE_SA_JSON }
        run: |
          echo "🎙️ Synthesizing OmniVoice section 'vocab' for Row #${ github.event.inputs.row_id }..."
          python src/omni_tts.py --row-id "${ github.event.inputs.row_id }" --section "vocab"